# Cloudflare Pages builds and serves www.varyvoda.com from main. This workflow only validates.
name: Validate site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.161.1'
        extended: true

    - name: Sync self-hosted font assets
      run: python3 scripts/sync-literata-italics.py

    - name: Build
      run: hugo --gc --minify

    - name: Check links and HTML
      run: |
        curl -sfL https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz | tar -xz htmltest
        python3 scripts/sync-literata-italics.py --check
        node scripts/validate-projects.mjs
        node --test scripts/test-typography.mjs
        ./htmltest -c .htmltest.yml
        node scripts/test-agent-readiness.mjs

    - name: Notify IndexNow of changed URLs
      if: github.event_name == 'push'
      env:
        INDEXNOW_BEFORE: ${{ github.event.before }}
        INDEXNOW_AFTER: ${{ github.sha }}
      run: |
        python3 scripts/submit-indexnow.py \
          --before "$INDEXNOW_BEFORE" \
          --after "$INDEXNOW_AFTER" \
          --key-file static/783cc6ce5ab0edd000732ed60336aa7c.txt
