{{- $c := .c -}}
{{- $pv := printf "%s/previews/%s.jpg" .cdn $c.slug -}}
<li><a href="/stitch-puzzle/charts/{{ $c.slug }}/"><img src="{{ $pv }}?w=220" srcset="{{ $pv }}?w=220 1x, {{ $pv }}?w=440 2x" width="{{ $c.preview_w }}" height="{{ $c.preview_h }}" alt="" loading="lazy"><span>{{ $c.name }}</span><small>{{ $c.w }} × {{ $c.h }} · {{ len $c.colors }} colours</small></a></li>
