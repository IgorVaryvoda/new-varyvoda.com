<section class="recent-care {{ .class }}" aria-labelledby="recent-care-title">
  <div class="home-section-inner">
    <header class="home-section-heading">
      <div><p class="eyebrow">Recently tended</p><h2 id="recent-care-title">What I fixed lately.</h2></div>
      <a class="text-link" href="/projects/">All projects</a>
    </header>
    <ol class="care-feed">
      {{ range hugo.Data.care }}
      <li>
        <time datetime="{{ .date }}">{{ time.Format "02 Jan 2006" .date }}</time>
        <a href="/projects/{{ .project }}/"><strong>{{ .title }}</strong></a>
        <p>{{ .change }}</p>
      </li>
      {{ end }}
    </ol>
  </div>
</section>
