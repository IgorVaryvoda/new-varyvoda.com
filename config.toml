[[params.social]]
  name = "Github"
  icon = "fa fa-github fa-2x"
  weight = 1
  url = "https://github.com/igorvaryvoda/"
[[params.social]]
  name = "Email"
  weight = 2
  url = "mailto:igor@varyvoda.com"

