baseurl = "https://www.varyvoda.com"
title = "Igor Varyvoda"
theme = "hugo-coder"
locale = "en"
defaultcontentlanguage = "en"
pygmentsstyle = "bw"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true
disableKinds = ["taxonomy", "term"]

disqusShortname = "varyvoda"

[outputs]
  home = ["HTML", "RSS", "Markdown"]
  section = ["HTML", "RSS", "Markdown"]
  page = ["HTML", "Markdown"]
[markup.goldmark.renderer]
  unsafe= true
[markup.highlight]
  style = "catppuccin-mocha"

[params]
  author = "Igor Varyvoda"
  info = "Product Builder and Operator"
  description = "Igor Varyvoda builds and operates internet products. He grew his first commercial website to roughly 50,000 daily visitors, led cross-functional teams and growth at Magic Toolbox and Sirv, and created Sirv Studio."
  avatarurl = "https://iantiark.sirv.com/pic.jpg?w=300"
  #gravatar = "igor@varyvoda.com"

  footercontent = ""
  hideFooter = false
  hideCredits = false
  hideCopyright = false
  since = 2025

  enableTwemoji = true

  colorScheme = "dark"
  hidecolorschemetoggle = true

  customCSS = []
  customSCSS = []
  customJS = []

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

# Social links
